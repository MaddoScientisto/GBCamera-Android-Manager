plugins {
    id 'com.android.application'
}

def defaultVersionCode = providers.gradleProperty('app.versionCode').get().toInteger()
def defaultVersionName = providers.gradleProperty('app.versionName').get()
def releaseVersionName = providers.gradleProperty('releaseVersionName').orElse(defaultVersionName).get()
def releaseVersionCode = providers.gradleProperty('releaseVersionCode').map { it.toInteger() }.orElse(defaultVersionCode).get()
def releaseStoreFileProvider = providers.gradleProperty('android.release.storeFile').orElse(providers.environmentVariable('ANDROID_RELEASE_STORE_FILE'))
def releaseStorePasswordProvider = providers.gradleProperty('android.release.storePassword').orElse(providers.environmentVariable('ANDROID_RELEASE_STORE_PASSWORD'))
def releaseKeyAliasProvider = providers.gradleProperty('android.release.keyAlias').orElse(providers.environmentVariable('ANDROID_RELEASE_KEY_ALIAS'))
def releaseKeyPasswordProvider = providers.gradleProperty('android.release.keyPassword').orElse(providers.environmentVariable('ANDROID_RELEASE_KEY_PASSWORD'))
def hasReleaseSigning = [
        releaseStoreFileProvider,
        releaseStorePasswordProvider,
        releaseKeyAliasProvider,
        releaseKeyPasswordProvider,
].every { it.present }

android {
    namespace 'com.mraulio.gbcameramanager'
    compileSdk 35

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFileProvider.get())
                storePassword releaseStorePasswordProvider.get()
                keyAlias releaseKeyAliasProvider.get()
                keyPassword releaseKeyPasswordProvider.get()
            }
        }
    }

    defaultConfig {
        applicationId "com.mraulio.gbcameramanager"
        minSdk 23
        targetSdk 33
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation": "$projectDir/schemas".toString()
                ]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.27'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.mik3y:usb-serial-for-android:3.10.0'
    implementation 'com.github.QuadFlask:colorpicker:0.0.15'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation("com.vanniktech:android-image-cropper:4.5.0")
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}